<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Forklift — Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;}
  body{
    background:#0a0a0b;color:#f2f2f3;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;
    background-image:linear-gradient(#2a2a2e 1px,transparent 1px),linear-gradient(90deg,#2a2a2e 1px,transparent 1px);
    background-size:48px 48px;
  }
  body::before{content:"";position:fixed;inset:0;background:#0a0a0b;opacity:0.94;pointer-events:none;}
  .wrap{position:relative;text-align:center;}
  .top-rule{height:2px;width:220px;background:#ff2b2b;margin:0 auto 22px;}
  .mark{font-weight:700;letter-spacing:-0.01em;color:#ff2b2b;font-size:34px;text-transform:uppercase;}
  .sub{margin-top:10px;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#9a9aa0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top-rule"></div>
    <div class="mark">Discount Forklift</div>
    <div class="sub">Inventory Intelligence</div>
  </div>
</body>
</html>
