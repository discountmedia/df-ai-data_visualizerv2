<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>States</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="row" style="align-items:stretch">
  <div class="card col" style="flex:1;align-items:center;justify-content:center;padding:18px;gap:10px">
    <div style="display:flex;gap:6px">
      <span style="width:8px;height:8px;border-radius:50%;background:#ff2b2b"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#ff2b2b;opacity:.6"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#ff2b2b;opacity:.3"></span>
    </div>
    <span class="eyebrow">Inferring schema…</span>
  </div>
  <div class="card col" style="flex:1;align-items:center;justify-content:center;padding:18px;gap:8px;border-color:rgba(255,59,70,.4);background:rgba(255,59,70,.05)">
    <span class="eyebrow" style="color:#ff3b46">Error</span>
    <span style="font-size:12px;color:#f2f2f3">Could not parse sheet</span>
  </div>
</div>

</body>
</html>
