<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work-Status Priority Pills</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="col" style="gap:9px;align-items:flex-start">
  <span style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:4px 9px;font-size:11px;color:#fff;background:#ff2b2b;border:1px solid #ff2b2b"><b style="font-weight:700">P1</b><span>● PIF — Open Work</span></span>
  <span style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:4px 9px;font-size:11px;color:#ff6a3d;border:1px solid rgba(255,106,61,.55);background:rgba(255,106,61,.08)"><b style="font-weight:700">P4</b><span>Down Pmt — Open Work</span></span>
  <span style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:4px 9px;font-size:11px;color:#ffb86b;border:1px solid rgba(255,184,107,.45);background:rgba(255,184,107,.06)"><b style="font-weight:700">P5</b><span>Down Payment ✓</span></span>
  <span style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:4px 9px;font-size:11px;color:#ffb86b;border:1px solid rgba(255,184,107,.45);background:rgba(255,184,107,.06)"><b style="font-weight:700">P9</b><span>Paid in Full ✓</span></span>
</div>
<p class="eyebrow" style="margin-top:14px">P{n} priority rank + state · hot=urgent/open, cool=settled</p>

</body>
</html>
