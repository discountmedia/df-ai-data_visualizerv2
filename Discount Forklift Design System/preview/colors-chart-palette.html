<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Palette</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div style="display:flex;height:64px;border:1px solid #2a2a2e;border-radius:6px;overflow:hidden">
  <div style="flex:1;background:#ff2b2b"></div><div style="flex:1;background:#3aa0ff"></div><div style="flex:1;background:#3ddc84"></div><div style="flex:1;background:#ffc02e"></div><div style="flex:1;background:#b07cff"></div><div style="flex:1;background:#ff8a3d"></div><div style="flex:1;background:#9a9aa0"></div>
</div>
<div class="row nums" style="margin-top:10px;font-size:9.5px;color:#5e5e66">
  <span style="flex:1;text-align:center">#ff2b2b</span><span style="flex:1;text-align:center">#3aa0ff</span><span style="flex:1;text-align:center">#3ddc84</span><span style="flex:1;text-align:center">#ffc02e</span><span style="flex:1;text-align:center">#b07cff</span><span style="flex:1;text-align:center">#ff8a3d</span><span style="flex:1;text-align:center">#9a9aa0</span>
</div>
<p class="eyebrow" style="margin-top:12px">Recharts series order · no pie charts</p>

</body>
</html>
