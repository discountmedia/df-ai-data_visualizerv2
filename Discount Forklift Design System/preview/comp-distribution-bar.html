<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution Bar</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="card" style="padding:14px">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;font-weight:700;color:#f2f2f3">Dallas Yard</span><span style="font-size:11px;color:#5e5e66" class="nums">312 units</span></div>
  <div style="display:flex;height:8px;border-radius:3px;overflow:hidden;background:rgba(42,42,46,.4);margin-top:10px">
    <div style="width:46%;background:#3ddc84"></div><div style="width:22%;background:#ffc02e"></div><div style="width:14%;background:#ff3b46"></div><div style="width:18%;background:#3aa0ff"></div>
  </div>
  <div class="wrap" style="margin-top:10px;font-size:10px;color:#9a9aa0;gap:12px">
    <span><span style="display:inline-block;width:8px;height:8px;background:#3ddc84;vertical-align:middle"></span> Ready <b class="nums" style="color:#f2f2f3">143</b></span>
    <span><span style="display:inline-block;width:8px;height:8px;background:#ffc02e;vertical-align:middle"></span> Working <b class="nums" style="color:#f2f2f3">69</b></span>
    <span><span style="display:inline-block;width:8px;height:8px;background:#ff3b46;vertical-align:middle"></span> Need Diag <b class="nums" style="color:#f2f2f3">44</b></span>
    <span><span style="display:inline-block;width:8px;height:8px;background:#3aa0ff;vertical-align:middle"></span> On Rent <b class="nums" style="color:#f2f2f3">56</b></span>
  </div>
</div>

</body>
</html>
