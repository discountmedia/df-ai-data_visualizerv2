<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="card" style="overflow:hidden">
  <table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left">
    <thead><tr style="border-bottom:1px solid #2a2a2e;color:#9a9aa0">
      <th style="padding:8px 12px;font-weight:400">Unit <span style="color:#ff2b2b">↑</span></th>
      <th style="padding:8px 12px;font-weight:400">Location</th>
      <th style="padding:8px 12px;font-weight:400">Work Stage</th>
      <th style="padding:8px 12px;font-weight:400;text-align:right">Price <span style="color:#5e5e66">↕</span></th>
    </tr></thead>
    <tbody>
      <tr style="border-bottom:1px solid rgba(42,42,46,.5)"><td style="padding:8px 12px;font-weight:700;color:#f2f2f3">Bella</td><td style="padding:8px 12px;color:#9a9aa0">Dallas</td><td style="padding:8px 12px"><span class="pill" style="color:#3ddc84;border-color:rgba(61,220,132,.4)">Ready</span></td><td class="nums" style="padding:8px 12px;text-align:right;color:#ff8a3d">$24.5K</td></tr>
      <tr style="border-bottom:1px solid rgba(42,42,46,.5);background:#17171a"><td style="padding:8px 12px;font-weight:700;color:#f2f2f3">Hyster H50</td><td style="padding:8px 12px;color:#9a9aa0">Houston</td><td style="padding:8px 12px"><span class="pill" style="color:#ff3b46;border-color:rgba(255,59,70,.4)">Needs Diag</span></td><td class="nums" style="padding:8px 12px;text-align:right;color:#ff8a3d">$18.0K</td></tr>
    </tbody>
  </table>
</div>
<p class="eyebrow" style="margin-top:12px">table-fixed · click header to sort · rows reorder in place</p>

</body>
</html>
