<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Card</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="row">
  <div class="card" style="flex:1;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Ready to Sell</span><span style="color:#5e5e66">→</span></div>
    <div class="nums" style="margin-top:8px;font-size:36px;font-weight:700;line-height:1;letter-spacing:-0.01em;color:#3ddc84">186</div>
    <div style="margin-top:8px;font-size:11px;color:#5e5e66">Fully prepped</div>
  </div>
  <div class="card" style="flex:1;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Needs Diagnosis</span><span style="color:#5e5e66">→</span></div>
    <div class="nums" style="margin-top:8px;font-size:36px;font-weight:700;line-height:1;letter-spacing:-0.01em;color:#ff3b46">42</div>
    <div style="margin-top:8px;font-size:11px;color:#5e5e66">Act first</div>
  </div>
</div>

</body>
</html>
