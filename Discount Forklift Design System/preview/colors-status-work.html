<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — Work Stage</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="wrap">
  
  <div class="sw">
    <div class="chip" style="background:#3ddc84"></div>
    <div class="lab">Ready</div>
    <div class="hex nums">#3ddc84  ·  --ready</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#ffc02e"></div>
    <div class="lab">Being Worked</div>
    <div class="hex nums">#ffc02e  ·  --working</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#ff3b46"></div>
    <div class="lab">Needs Diag</div>
    <div class="hex nums">#ff3b46  ·  --diag</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#3aa0ff"></div>
    <div class="lab">On Rent</div>
    <div class="hex nums">#3aa0ff  ·  --rent</div>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px">Work-stage semantics · cards, pills, bars, charts</p>

</body>
</html>
