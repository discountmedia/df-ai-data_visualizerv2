<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Numerals</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="row" style="gap:20px;align-items:flex-end">
  <div>
    <div class="eyebrow">Total Fleet</div>
    <div style="font-family:var(--font-display);font-size:52px;line-height:.9;color:#f2f2f3">1256</div>
  </div>
  <div>
    <div class="eyebrow">Ready</div>
    <div style="font-family:var(--font-display);font-size:52px;line-height:.9;color:#3ddc84">117</div>
  </div>
  <div>
    <div class="eyebrow">Needs Diag</div>
    <div style="font-family:var(--font-display);font-size:52px;line-height:.9;color:#ff3b46">409</div>
  </div>
  <div>
    <div class="eyebrow">Sold</div>
    <div style="font-family:var(--font-display);font-size:52px;line-height:.9;color:#ff2b2b">175</div>
  </div>
</div>
<p class="eyebrow" style="margin-top:16px">Heavy condensed display (Anton*) — big stats only · labels stay mono</p>

</body>
</html>
