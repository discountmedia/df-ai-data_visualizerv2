<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="wrap">
  
  <div class="sw">
    <div class="chip" style="background:#0a0a0b"></div>
    <div class="lab">Ground</div>
    <div class="hex nums">#0a0a0b  ·  --ground</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#121214"></div>
    <div class="lab">Panel</div>
    <div class="hex nums">#121214  ·  --panel</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#17171a"></div>
    <div class="lab">Panel 2</div>
    <div class="hex nums">#17171a  ·  --panel-2</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#2a2a2e"></div>
    <div class="lab">Line</div>
    <div class="hex nums">#2a2a2e  ·  --line</div>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px">Dark theme · surface ramp + hairline border</p>

</body>
</html>
