<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — Sale / Payment</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>

<div class="wrap">
  
  <div class="sw">
    <div class="chip" style="background:#ff8a3d"></div>
    <div class="lab">Paid in Full</div>
    <div class="hex nums">#ff8a3d  ·  --pif</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#ffb86b"></div>
    <div class="lab">Down Payment</div>
    <div class="hex nums">#ffb86b  ·  --downpmt</div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#b07cff"></div>
    <div class="lab">Govt PO</div>
    <div class="hex nums">#b07cff  ·  --govt</div>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px">Payment-type semantics</p>

</body>
</html>
